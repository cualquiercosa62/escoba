<!doctype html>
<html lang="en">
<head>
<title>Escoba de 15</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one felt table, opponents across the top, the table cards in the middle, your hand at the bottom. Single deliberate dark "baize" look. */
:root{
  --felt:#163f35; --felt-deep:#0d2a23; --felt-line:#2b5e50;
  --ink:#f1e8d4; --ink-dim:#b9c4b4; --gold:#e1b95a; --gold-deep:#a67c1f;
  --card:#fbf5e6; --card-ink:#2b231d; --card-edge:#d8ccb0;
  --oro:#c08f1c; --copa:#b2352c; --espada:#2d5a88; --basto:#5a7a28;
  --danger:#e0806b;
  --display:"Alegreya SC", Georgia, serif;
  --body:"Alegreya Sans", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{min-height:100vh;background:radial-gradient(120% 70% at 50% 0%, var(--felt) 0%, var(--felt-deep) 100%) no-repeat var(--felt-deep);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,6vw,3.4rem);font-weight:800;color:var(--gold);line-height:1}
h2{font-size:1.4rem;font-weight:700}
.sub{color:var(--ink-dim);margin:4px 0 0}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-dim)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:rgba(0,0,0,.22);border:1px solid var(--felt-line);border-radius:14px;padding:16px}
label{font-size:.85rem;color:var(--ink-dim);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;background:var(--felt-deep);color:var(--ink);border:1px solid var(--felt-line);border-radius:8px;padding:9px 11px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:9px 18px;border:1px solid var(--gold);background:var(--gold);color:#2a1e05}
.btn:hover:not(:disabled){background:#ecc874}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover:not(:disabled){background:rgba(225,185,90,.12)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:5px 12px;font-size:.85rem}
.note{font-size:.9rem;color:var(--ink-dim)}
.warn{border-color:var(--gold-deep);color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.list{display:flex;flex-direction:column;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04)}
.code{font-family:var(--display);font-weight:800;letter-spacing:.18em;color:var(--gold)}
.bigcode{font-size:2.6rem;line-height:1}

/* cards */
.card{position:relative;width:96px;height:144px;border-radius:11px;background:var(--card);color:var(--card-ink);border:1px solid var(--card-edge);box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font:inherit;transition:transform .15s ease, box-shadow .15s ease;flex:none}
.card:disabled{cursor:default}
.card:not(:disabled):hover{transform:translateY(-3px)}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold),0 10px 18px rgba(0,0,0,.35)}
.card.hint{box-shadow:0 0 0 3px #8fd3b4,0 6px 14px rgba(0,0,0,.25)}
.card .cr{position:absolute;top:6px;left:8px;font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1}
.card .cv{position:absolute;bottom:6px;right:8px;font-size:.85rem;font-weight:700;opacity:.7}
.card .cn{position:absolute;bottom:6px;left:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.card .pip{width:56px;height:56px;display:block}
.card .pip svg{width:100%;height:100%;display:block}
.s-o .cr{color:var(--oro)} .s-c .cr{color:var(--copa)} .s-e .cr{color:var(--espada)} .s-b .cr{color:var(--basto)}
.back{width:26px;height:38px;border-radius:5px;background:repeating-linear-gradient(45deg,#7d2a22 0 4px,#94372c 4px 8px);border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.4);flex:none}
.backs{display:flex;gap:3px}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:150px;align-items:center}

/* table */
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.pl{padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid var(--felt-line);display:flex;flex-direction:column;gap:6px;min-width:0}
.pl.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.pl .nm{font-weight:700;display:flex;gap:6px;align-items:center;justify-content:space-between;min-width:0}
.pl .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .score{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--gold);line-height:1}
.pl .meta{font-size:.8rem;color:var(--ink-dim);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;border-radius:999px;border:1px solid var(--felt-line);color:var(--ink-dim)}
.tag.on{border-color:var(--gold);color:var(--gold)}
.felt{border-radius:22px;padding:22px 14px;background:rgba(0,0,0,.18);border:2px dashed var(--felt-line);display:flex;flex-direction:column;gap:10px;align-items:center}
.felt .eyebrow{align-self:flex-start}
.prompt{text-align:center;font-size:1.05rem;min-height:1.5em}
.prompt b{color:var(--gold)}
.meter{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.meter.ok{color:#8fd3b4}
.meter.over{color:var(--danger)}
.hand{display:flex;flex-direction:column;gap:12px;align-items:center}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.log{max-height:180px;overflow:auto;font-size:.9rem;color:var(--ink-dim);display:flex;flex-direction:column;gap:4px;margin:8px 0 0;padding:0;list-style:none}
.log li:first-child{color:var(--ink)}
table.res{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.res th,table.res td{padding:7px 8px;border-bottom:1px solid var(--felt-line);text-align:center}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);font-weight:500}
.scroll{overflow-x:auto}
.win{color:var(--gold);font-weight:700}
details summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.1rem}
details ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--card);color:var(--card-ink);padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:20;max-width:calc(100% - 32px)}
.flash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:15}
.flash div{font-family:var(--display);font-weight:800;font-size:clamp(3rem,14vw,7rem);color:var(--gold);text-shadow:0 4px 0 #6b4d0c,0 10px 40px rgba(0,0,0,.6);animation:pop 1.8s ease forwards;text-align:center;line-height:1}
.flash small{display:block;font-size:1.4rem;color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.6)}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}15%{transform:scale(1.08) rotate(2deg);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.card,.flash div{transition:none;animation:none}}
@media (max-width:520px){.card .cn{display:none}.card{width:76px;height:114px}.card .pip{width:42px;height:42px}.card .cr{font-size:1.3rem}.cards{gap:8px;min-height:118px}}
.card.fresh{box-shadow:0 0 0 3px #8fd3b4,0 6px 14px rgba(0,0,0,.25);animation:glow 2.5s ease forwards}
@keyframes glow{0%,70%{box-shadow:0 0 0 4px #8fd3b4,0 0 18px #8fd3b4}100%{box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25)}}
.card.going{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(225,185,90,.55);opacity:1;cursor:default}
.card.going.stolen{box-shadow:0 0 0 3px var(--danger),0 0 16px rgba(224,128,107,.55)}
.prompt.notice{font-size:1rem}
.bad{color:var(--danger);font-weight:700}
.r70c.wrongc{display:flex;flex-wrap:wrap;justify-content:flex-start}
.ghostgrp{display:flex;flex-wrap:wrap;gap:inherit;justify-content:center}
.ghostgrp.gap{margin-left:28px}
@media (max-width:520px){.ghostgrp.gap{margin-left:18px}}
.card.sm{width:54px;height:81px;border-radius:7px}.card.sm .pip{width:30px;height:30px}.card.sm .cr{font-size:1rem;top:4px;left:5px}.card.sm .cn,.card.sm .cv{display:none}
.l70{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.r70{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:8px}
.r70h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.v70{font-family:var(--display);font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.r70c{display:grid;grid-template-columns:repeat(2,max-content);gap:8px 10px;justify-content:center}
.c70{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.85rem;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.miss{width:54px;height:81px;border-radius:7px;border:1.5px dashed var(--felt-line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.7rem;padding:4px;color:var(--ink-dim)}
@keyframes fadeout{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.btn.steal{background:var(--danger);border-color:var(--danger);color:#2a0d05}
.btn.steal:hover:not(:disabled){background:#eb9a87}
.hiddenlog{font-size:.9rem;color:var(--ink-dim);margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="flash" id="flash" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="/rules.js"></script>
<script>
const {val,label,nm,findCapture,RNAME}=window.Escoba;
const SVG={
 o:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#e3b23c" stroke="#a87a14" stroke-width="2.5"/><circle cx="20" cy="20" r="8" fill="none" stroke="#a87a14" stroke-width="2"/><circle cx="20" cy="20" r="2.5" fill="#a87a14"/></svg>',
 c:'<svg viewBox="0 0 40 40"><path d="M9 6h22c0 10-4 15.5-9 16.5V30h6v4H12v-4h6v-7.5C13 21.5 9 16 9 6z" fill="#b2352c" stroke="#7a1e18" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 9h16" stroke="#e8c15a" stroke-width="2"/></svg>',
 e:'<svg viewBox="0 0 40 40"><path d="M18.3 3h3.4l1.6 23h-6.6z" fill="#9db4cc" stroke="#2d5a88" stroke-width="1.5" stroke-linejoin="round"/><rect x="11" y="25.5" width="18" height="3.5" rx="1.5" fill="#2d5a88"/><rect x="18.3" y="29" width="3.4" height="6" fill="#7a5a2a"/><circle cx="20" cy="36.5" r="2.2" fill="#2d5a88"/></svg>',
 b:'<svg viewBox="0 0 40 40"><path d="M15 5.5c3-2.5 9-2 10.5 2.5L23 36h-6.5L13 10c-.3-1.8.5-3.3 2-4.5z" fill="#8a6a2e" stroke="#4c3a12" stroke-width="1.5" stroke-linejoin="round"/><circle cx="17" cy="13" r="1.8" fill="#5a7a28"/><circle cx="22" cy="20" r="1.8" fill="#5a7a28"/><circle cx="18.5" cy="27" r="1.8" fill="#5a7a28"/></svg>'
};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=s=>document.querySelector(s);
const app=$('#app');
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function unstore(k){try{localStorage.removeItem(k)}catch(e){}}
let pid=load('escoba.pid'); if(!pid){pid='p'+Math.random().toString(36).slice(2,12);store('escoba.pid',pid)}
let myName=load('escoba.name')||'';
let offline=false,ready=false,view='lobby',code=null,game=null,es=null,openGames=[];
let stealMode=false,selHand=null,selTable=new Set(),hint=null,busy=false,lastRev=-1,lastFlash=null,shownRev=null,lastShow=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function getName(){const v=($('#name')?.value||myName||'').trim().slice(0,20);if(!v){toast('Type your name first.');$('#name')?.focus();return null}myName=v;store('escoba.name',v);return v}

async function post(url,body){
  if(busy)return null;busy=true;
  try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid,code,...body})});const j=await r.json();if(j.error){toast(j.error);return null}return j}
  catch(e){toast('Could not reach the server. Try again.');return null}
  finally{busy=false}
}
const act=(type,extra={})=>post('/api/action',{type,...extra});
// Steals and challenges: a wrong call changes nothing, so the reply is the same whatever was wrong.
function quietAct(type,extra){
  return fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid,code,type,...extra})}).then(r=>r.json())
    .then(j=>{if(j.error)toast(j.error==='NOSTEAL'?'Nothing to steal there. Play goes on.':j.error==='NOCHALLENGE'?'No luck: nothing changes. Play goes on.':j.error)})
    .catch(()=>toast('Could not reach the server. Try again.'));
}

async function createGame(solo){const name=getName();if(!name)return;const history=$('#history').value==='on',hints=$('#hints').value==='on',penalty=+$('#penalty').value;store('escoba.opts',JSON.stringify({history,hints,penalty}));const j=await post('/api/create',{name,target:+($('#target')?.value||15),history,hints,penalty});if(!j)return;const level=$('#botlevel')?.value||'easy';openGame(j.code);if(solo){store('escoba.botlevel',level);await act('addbot',{level});await act('start')}}
function joinSeat(){const name=getName();if(name)act('join',{name})}

function openGame(c,quiet){
  c=c.toUpperCase();if(es)es.close();code=c;game=null;view='game';selHand=null;selTable.clear();hint=null;lastFlash=null;lastRev=-1;shownRev=null;lastShow=null;
  try{history.replaceState(null,'','#'+c)}catch(e){}
  render();
  es=new EventSource('/api/events?code='+encodeURIComponent(c)+'&pid='+encodeURIComponent(pid));
  let got=false;
  es.onmessage=ev=>{
    got=true;const s=JSON.parse(ev.data);
    if(s.gone){toast('The table was closed.');return leave()}
    game=s;store('escoba.game',c);
    if(s.rev!==lastRev){lastRev=s.rev;selHand=(s.hands?.[pid]||[]).includes(selHand)?selHand:null;for(const t of [...selTable])if(!s.table?.includes(t))selTable.delete(t);hint=null}
    if(s.status!=='playing'&&s.status!=='lastcall')stealMode=false;
    if(shownRev===null)shownRev=s.last?.rev||0;
    else if(s.last&&s.last.rev===s.rev&&s.last.rev!==shownRev){shownRev=s.last.rev;const ms=s.last.kind==='drop'?2500:s.last.kind==='challenge'?3500:5000;lastShow={...s.last,until:Date.now()+ms};clearTimeout(openGame.t);openGame.t=setTimeout(()=>{lastShow=null;if(view==='game')render()},ms)}
    if(lastFlash===null)lastFlash=s.flash?.at||0;
    else if(s.flash&&s.flash.at>lastFlash){lastFlash=s.flash.at;showFlash(nm(s,s.flash.pid))}
    if(view==='game')render();
  };
  es.onerror=()=>{if(!got){es.close();es=null;if(!quiet)toast(`No table with code ${c}.`);leave()}};
}
function leave(){if(es)es.close();es=null;game=null;code=null;view='lobby';unstore('escoba.game');try{history.replaceState(null,'','#')}catch(e){}render();pollLobby()}
function showFlash(who){const f=$('#flash');f.innerHTML=`<div>¡Escoba!<small>${esc(who)}</small></div>`;f.hidden=false;clearTimeout(showFlash.t);showFlash.t=setTimeout(()=>f.hidden=true,1900)}

async function pollLobby(){
  clearTimeout(pollLobby.t);if(view!=='lobby')return;
  try{const r=await fetch('/api/lobby');openGames=await r.json();offline=false}catch(e){offline=true}
  ready=true;if(view==='lobby')renderLobby();
  pollLobby.t=setTimeout(pollLobby,4000);
}

/* ---------- render ---------- */
const half=n=>n===null||n===undefined?'—':(n%1?Math.floor(n)+'½':String(n));
function cardHTML(c,o={}){
  const r=+c.slice(1);
  return `<button class="card s-${c[0]}${o.cls?' '+o.cls:''}${o.sm?' sm':''}${o.sel?' sel':''}${o.hint?' hint':''}${o.fresh?' fresh':''}" ${o.act?`data-act="${o.act}" data-card="${c}"`:''} ${o.dis?'disabled':''} aria-label="${label(c)}, worth ${val(c)}" aria-pressed="${!!o.sel}"><span class="cr">${r}</span><span class="pip">${SVG[c[0]]}</span><span class="cn">${RNAME[r]||''}</span><span class="cv">${val(c)}</span></button>`;
}
function render(){view==='lobby'?renderLobby():renderGame()}

const RULES=`<details class="panel"><summary>How to play</summary><ul>
<li>Spanish 40-card deck. Cards 1–7 count their number. Sota (10) counts 8, Caballo (11) counts 9, Rey (12) counts 10. The small number in each card's corner is its value.</li>
<li>Everyone gets 3 cards and 4 go face up on the table. On your turn play one card: either capture table cards that add up to <b>15</b> together with your card, or lay it down.</li>
<li>To capture: tap the table cards you want, then a card from your hand, then <b>Capture</b>. Clearing the whole table is an <b>escoba</b>, worth 1 point.</li>
<li>The game does not check your sums. If you think a capture did not add up to 15, press <b>Challenge capture</b> before the next card is played. If you are right, the cards go back on the table and any escoba is cancelled. If you are wrong, nothing happens.</li>
<li>When hands run out, 3 more are dealt until the deck is gone. With 5 players the last deal is 1 card each, and the spare card goes on the table. Cards left on the table go to whoever captured last.</li>
<li>Mistakes cost you. If a player lays a card down when it could have made 15, any other player can press <b>¡Robar!</b>, tap that card plus the table cards that make 15, and press <b>Confirm steal</b> to take them. This works until the next card is played. A wrong guess changes nothing. Clearing the table this way counts as an escoba.</li>
<li>If the first four cards on the table add up to 15 or 30, the first player to play takes them as 1 or 2 escobas.</li>
<li>When someone captures, their card and the cards they took move to the end of the table row and stay highlighted for 5 seconds. A card laid down is added to the right of the table and glows for a moment. Nobody sees how many cards anyone has taken. If table talk is hidden, that is your only chance to see them, so pay attention.</li>
<li>Wrong captures that nobody challenged are revealed when the round is counted, and each one costs the points chosen for the table.</li>
<li>Computer players can join any table. Easy ones sometimes miss a 15 and rarely catch your mistakes. Hard ones play well and almost always catch them. They never make wrong captures themselves.</li>
<li>When all the cards are played, there is one last chance to steal or challenge before anyone presses <b>Count the cards</b>.</li>
<li>Each round scores 1 point each for: most cards, most oros, <b>los 70</b>, the 7 de oros, every escoba, and 1 extra for all ten oros. Ties score nothing.</li>
<li><b>Los 70:</b> take your best card in each of the four suits and add them up. Sevens count 7, sixes 6, aces 5½, then 5, 4, 3, 2. Sota, Caballo and Rey (negras) count 0, but they still count as having that suit. If you don't have a card in all four suits, you can't win this point.</li>
<li>First player to reach the target score wins. A tie at the top plays another round.</li></ul></details>`;

function renderLobby(){
  const blocked=offline?`<div class="panel warn">Can't reach the game server. Check your connection; this page retries on its own.</div>`:'';
  const list=openGames.length?`<ul class="list">${openGames.map(g=>{const ps=g.names||[];return `<li><span><span class="code">${esc(g.code)}</span> &nbsp;${esc(ps.join(', '))} <span class="note">· ${ps.length}/6 · to ${g.target}${g.opts&&!g.opts.history?' · no table talk':''}</span></span><button class="btn small ghost" data-act="open" data-code="${esc(g.code)}">Open</button></li>`}).join('')}</ul>`
    :`<p class="note">${ready?'No tables waiting right now. Start one and tell your friends the code.':'Looking for open tables…'}</p>`;
  if($('#lobby')){$('#openlist').innerHTML=list;$('#lobbynote').innerHTML=blocked;return}
  let savedOpts={};try{savedOpts=JSON.parse(load('escoba.opts')||'{}')}catch(e){}
  app.innerHTML=`<header><div class="eyebrow">Online card table · 2 to 6 players</div><h1>Escoba de 15</h1><p class="sub">Sweep the table, count your oros, and keep an eye on the 7 de oros.</p></header>
  <div id="lobbynote">${blocked}</div>
  <div class="grid2" id="lobby">
    <section class="panel" style="display:flex;flex-direction:column;gap:14px">
      <h2>Start a table</h2>
      <label for="name">Your name<input id="name" maxlength="20" autocomplete="nickname" value="${esc(myName)}" placeholder="e.g. Sil"></label>
      <label for="target">Play to<select id="target"><option value="15" selected>15 points</option><option value="21">21 points</option><option value="31">31 points</option></select></label>
      <label for="history">Table talk (history of moves)<select id="history"><option value="off" ${savedOpts.history?'':'selected'}>Hidden: players must remember</option><option value="on" ${savedOpts.history?'selected':''}>Shown</option></select></label>
      <label for="penalty">Wrong capture nobody caught costs<select id="penalty">${[0,1,2,3].map(n=>`<option value="${n}" ${(savedOpts.penalty??1)===n?'selected':''}>${n?n+' point'+(n>1?'s':''):'Nothing'}</option>`).join('')}</select></label>
      <label for="hints">Hint button<select id="hints"><option value="off" ${savedOpts.hints?'':'selected'}>Off</option><option value="on" ${savedOpts.hints?'selected':''}>On</option></select></label>
      <div class="row"><button class="btn" data-act="create">Create table</button></div>
      <div class="row" style="align-items:flex-end"><label for="botlevel">Computer plays<select id="botlevel"><option value="easy" ${load('escoba.botlevel')==='hard'?'':'selected'}>Easy</option><option value="hard" ${load('escoba.botlevel')==='hard'?'selected':''}>Hard</option></select></label><button class="btn ghost" data-act="solo">Play against the computer</button></div>
      <hr style="border:0;border-top:1px solid var(--felt-line);width:100%;margin:2px 0">
      <label for="joincode">Have a code?<div class="row"><input id="joincode" maxlength="4" placeholder="ABCD" style="text-transform:uppercase;width:7.5em;letter-spacing:.15em"><button class="btn ghost" data-act="joincode">Go to table</button></div></label>
    </section>
    <section class="panel"><h2>Open tables</h2><div id="openlist">${list}</div></section>
  </div>${RULES}`;
}

function renderGame(){
  const s=game;
  if(!s){app.innerHTML=`<p class="note">Opening table ${esc(code)}…</p>`;return}
  const back=`<button class="btn small ghost" data-act="leave">Back to lobby</button>`;
  if(s.status==='lobby'){
    const ps=Object.entries(s.players||{}).sort((a,b)=>a[1].joinedAt-b[1].joinedAt);
    const seated=!!s.players?.[pid];const host=s.host===pid;
    app.innerHTML=`<div class="topbar"><div><div class="eyebrow">Table code</div><div class="code bigcode">${esc(s.code)}</div></div>${back}</div>
    <section class="panel" style="display:flex;flex-direction:column;gap:12px">
      <h2>Waiting for players</h2>
      <p class="note">Friends open this website and enter the code <b class="code">${esc(s.code)}</b>, or pick it from Open tables. Playing to ${s.target}. Table talk ${s.opts&&!s.opts.history?'hidden':'shown'}, hints ${s.opts&&!s.opts.hints?'off':'on'}. An uncaught wrong capture costs ${s.opts&&s.opts.penalty!==undefined?s.opts.penalty:0} point${s.opts&&s.opts.penalty===1?'':'s'}.</p>
      <ul class="list">${ps.map(([p,v],i)=>`<li><span>${esc(v.name)}${p===pid?' <span class="note">(you)</span>':''}</span><span class="row" style="gap:6px">${v.bot?'<span class="tag">computer</span>':''}<span class="tag${p===s.host?' on':''}">${p===s.host?'host':'seat '+(i+1)}</span>${v.bot&&host?`<button class="btn small ghost" data-act="removebot" data-id="${esc(p)}" aria-label="Remove ${esc(v.name)}">Remove</button>`:''}</span></li>`).join('')}</ul>
      ${host&&ps.length<6?`<div class="row" style="align-items:flex-end"><label for="addlevel">Add a computer player<select id="addlevel"><option value="easy">Easy</option><option value="hard">Hard</option></select></label><button class="btn small ghost" data-act="addbot">Add computer</button></div>`:''}
      ${!seated?`<div class="row"><label for="name">Your name<input id="name" maxlength="20" value="${esc(myName)}" placeholder="Your name"></label><button class="btn" data-act="join" ${ps.length>=6?'disabled':''}>Take a seat</button></div>`:''}
      <div class="row">${host?`<button class="btn" data-act="start" ${ps.length<2?'disabled':''}>Deal the cards</button><span class="note">${ps.length<2?'Needs at least 2 players.':ps.length+' players ready.'}</span>`:(seated?`<span class="note">Waiting for ${esc(nm(s,s.host))} to deal.</span><button class="btn small ghost" data-act="unseat">Give up seat</button>`:'')}</div>
    </section>${RULES}`;
    return;
  }
  const me=s.order.includes(pid)?pid:null;
  const live=s.status==='playing'||s.status==='lastcall';
  const myTurn=s.status==='playing'&&s.order[s.turnIdx]===me;
  const hand=me?(s.hands[me]||[]):[];
  const hintsOn=!s.opts||s.opts.hints, historyOn=!s.opts||s.opts.history;
  const tableClickable=myTurn||(stealMode&&!!me);
  const ls=lastShow&&lastShow.until>Date.now()?lastShow:null;
  // Captured cards slide to the end of the table row, highlighted, for 5 seconds. A laid-down card or cards put back just glow.
  let notice='',ghosts=[],ghostCls='going';
  if(ls&&live){
    const W=`<b>${esc(nm(s,ls.pid))}</b>`;
    if(ls.kind==='capture'){ghosts=[...ls.take,ls.card];notice=`${W} captures the highlighted cards${ls.escoba?': <b>¡Escoba!</b>':'.'}`}
    else if(ls.kind==='opening'){ghosts=ls.take;notice=`The first four cards add up to ${ls.count*15}: ${W} gets <b>${ls.count} escoba${ls.count>1?'s':''}</b>.`}
    else if(ls.kind==='steal'){ghosts=ls.take;ghostCls='going stolen';notice=`${W} steals the highlighted cards from <b>${esc(nm(s,ls.from))}</b>${ls.escoba?': <b>¡Escoba!</b>':'.'}`}
    else if(ls.kind==='challenge')notice=`${W} challenged <b>${esc(nm(s,ls.from))}</b>: that capture did not add up to 15. The glowing cards go back on the table.`;
  }
  const freshSet=new Set(ls&&(ls.kind==='drop'?[ls.card]:ls.kind==='challenge'?ls.take:[]));
  const players=s.order.map((p,i)=>`<div class="pl${s.status==='playing'&&i===s.turnIdx?' turn':''}"><div class="nm"><span>${esc(nm(s,p))}${p===pid?' (you)':''}</span><span class="score">${s.scores[p]||0}</span></div>
    <div class="meta"><span class="backs" aria-label="${(s.hands[p]||[]).length} cards in hand">${(s.hands[p]||[]).map(()=>'<span class="back"></span>').join('')}</span>${s.escobas[p]?`<span class="tag on">${s.escobas[p]} escoba${s.escobas[p]>1?'s':''}</span>`:''}${i===s.dealerIdx?'<span class="tag">deals</span>':''}</div></div>`).join('');
  let prompt='';
  if(s.status==='lastcall')prompt=stealMode?`<b>Stealing:</b> tap the cards to steal, then press Confirm steal.`:`<b>All cards are played.</b> Last chance to steal or challenge, then count the cards.`;
  else if(s.status!=='playing')prompt='';
  else if(!me)prompt=`You are watching. It's <b>${esc(nm(s,s.order[s.turnIdx]))}</b>'s turn.`;
  else if(stealMode)prompt=`<b>Stealing:</b> tap the cards to steal, then press Confirm steal.`;
  else if(!myTurn)prompt=`Waiting for <b>${esc(nm(s,s.order[s.turnIdx]))}</b>…`;
  else if(!selHand&&!selTable.size)prompt=`<b>Your turn.</b> Tap table cards to capture, then a card from your hand.`;
  else prompt=`${selHand?'Your card':'No hand card yet'} + ${selTable.size} table card${selTable.size===1?'':'s'}`;
  const canCap=!stealMode&&myTurn&&selHand&&selTable.size>0;
  const canDrop=!stealMode&&myTurn&&selHand&&!selTable.size;
  const canSteal=stealMode&&selTable.size>0;
  const extraBtns=me?`<div class="actions">${stealMode?`<button class="btn steal" data-act="steal-go" ${canSteal?'':'disabled'}>Confirm steal</button><button class="btn ghost small" data-act="steal-cancel">Cancel</button>`:`<button class="btn steal" data-act="steal">¡Robar!</button>`}<button class="btn steal" data-act="challenge" title="Say the last capture did not add up to 15">Challenge capture</button>${hintsOn&&s.status==='playing'?`<button class="btn ghost small" data-act="hint" ${myTurn?'':'disabled'}>Hint</button>`:''}</div>`:'';
  let bottom;
  if(s.status==='playing'){
    bottom=`<section class="hand"><div class="eyebrow">${me?'Your hand':'Spectating'}</div>
    <div class="cards">${me?hand.map(c=>cardHTML(c,{act:'hand',sel:c===selHand,hint:hint&&hint.hand===c,dis:!myTurn||stealMode})).join('')||'<span class="note">No cards in hand.</span>':''}</div>
    ${me?`<div class="actions"><button class="btn" data-act="capture" ${canCap?'':'disabled'}>Capture</button><button class="btn ghost" data-act="drop" ${canDrop?'':'disabled'}>Lay it down</button></div>`:''}${extraBtns}</section>`;
  }else if(s.status==='lastcall'){
    bottom=`<section class="hand">${extraBtns}<div class="actions"><button class="btn" data-act="count" ${me?'':'disabled'}>Count the cards</button></div></section>`;
  }else{
    const rows=s.roundResult||[];
    const tick=b=>b?'<span class="win">✓</span>':'';
    const SUITN={o:'Oros',c:'Copas',e:'Espadas',b:'Bastos'};
    const p70=r=>`<div class="r70"><div class="r70h"><b>${esc(nm(s,r.pid))}</b><span class="v70">${r.setenta===null?'No points':half(r.setenta)} ${tick(r.w_setenta)}</span></div>
      <div class="r70c">${'ocbe'.split('').map(su=>{const c=r.best70&&r.best70[su];return c?`<div class="c70">${cardHTML(c,{dis:true,sm:true})}<span>${half(window.Escoba.P70[+c.slice(1)]||0)}</span></div>`:`<div class="c70"><div class="miss">No ${SUITN[su]}</div><span>—</span></div>`}).join('')}</div></div>`;
    bottom=`<section class="panel" style="display:flex;flex-direction:column;gap:12px">
      <h2>${s.status==='gameover'?`${esc(nm(s,s.winner))} wins!`:`Round ${s.round} results`}</h2>
      <div class="scroll"><table class="res"><thead><tr><th>Player</th><th>Cards</th><th>Oros</th><th>Los 70</th><th>7 de oros</th><th>Escobas</th><th>Mistakes</th><th>Round</th><th>Total</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(nm(s,r.pid))}</td><td>${r.cards} ${tick(r.w_cards)}</td><td>${r.oros} ${tick(r.w_oros)}</td><td>${half(r.setenta)} ${tick(r.w_setenta)}</td><td>${r.velo?'<span class="win">✓</span>':'–'}</td><td>${r.escobas}</td><td>${r.penalty?`<span class="bad">−${r.penalty}</span>`:'–'}</td><td class="win">${r.pts>=0?'+':'−'}${Math.abs(r.pts)}</td><td>${s.scores[r.pid]}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="note">✓ marks who won each point. Playing to ${s.target}.</p>
      ${(s.revealed||[]).length?`<h3>Wrong captures nobody caught</h3><div class="l70">${s.revealed.map(m=>`<div class="r70"><div class="r70h"><b>${esc(nm(s,m.by))}</b><span class="bad">${[m.card,...m.take].reduce((a,c)=>a+val(c),0)} ≠ 15</span></div><div class="r70c wrongc">${[m.card,...m.take].map(c=>cardHTML(c,{dis:true,sm:true})).join('')}</div></div>`).join('')}</div>`:''}
      <h3>Los 70</h3>
      <p class="note" style="margin:0">Each player's best card in every suit. 7 = 7, 6 = 6, As = 5½, then 5 to 2. Sota, Caballo and Rey count 0.</p>
      <div class="l70">${rows.map(p70).join('')}</div>
      <div class="row">${s.status==='gameover'?`<button class="btn" data-act="rematch" ${me?'':'disabled'}>Play again, same table</button>`:`<button class="btn" data-act="next" ${me?'':'disabled'}>Deal next round</button>`}</div>
    </section>`;
  }
  app.innerHTML=`<div class="topbar"><div><div class="eyebrow">Table <span class="code">${esc(s.code)}</span> · Round ${s.round} · to ${s.target}</div><h2>Escoba de 15</h2></div><div class="row"><span class="note">${s.deckCount||0} cards in deck</span>${back}</div></div>
  <div class="players">${players}</div>
  <section class="felt"><div class="eyebrow">Table</div>
    <div class="cards">${(s.table||[]).map(c=>cardHTML(c,{act:'table',sel:selTable.has(c),hint:hint&&hint.take.includes(c),fresh:freshSet.has(c),dis:!tableClickable})).join('')}${ghosts.length?`<span class="ghostgrp${(s.table||[]).length?' gap':''}">${ghosts.map(c=>cardHTML(c,{dis:true,cls:ghostCls})).join('')}</span>`:''}${!(s.table||[]).length&&!ghosts.length?'<span class="note">The table is empty.</span>':''}</div>
    ${notice?`<div class="prompt notice">${notice}</div>`:''}<div class="prompt">${prompt}</div></section>
  ${bottom}
  <section class="panel"><div class="row" style="justify-content:space-between"><h3>Table talk</h3>${s.host===pid?'<button class="btn small ghost" data-act="end">Close table</button>':''}</div>${historyOn?`<ul class="log">${(s.log||[]).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:'<p class="hiddenlog">Table talk is hidden at this table. Keep track of what everyone takes yourself.</p>'}</section>`;
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,c=b.dataset.card;
  switch(a){
    case 'create':return createGame();
    case 'joincode':{const v=($('#joincode').value||'').trim().toUpperCase();if(!/^[A-Z]{4}$/.test(v))return toast('Codes are 4 letters, like ABCD.');getName();return openGame(v)}
    case 'open':getName();return openGame(b.dataset.code);
    case 'leave':return leave();
    case 'join':return joinSeat();
    case 'unseat':return act('unseat').then(j=>j&&leave());
    case 'start':return act('start');
    case 'solo':return createGame(true);
    case 'addbot':return act('addbot',{level:$('#addlevel').value});
    case 'removebot':return act('removebot',{id:b.dataset.id});
    case 'hand':selHand=selHand===c?null:c;hint=null;return render();
    case 'table':selTable.has(c)?selTable.delete(c):selTable.add(c);hint=null;return render();
    case 'capture':return act('play',{card:selHand,take:[...selTable]});
    case 'steal':stealMode=true;selHand=null;selTable.clear();hint=null;return render();
    case 'steal-cancel':stealMode=false;selTable.clear();return render();
    case 'steal-go':{const take=[...selTable];stealMode=false;selTable.clear();render();return quietAct('steal',{take})}
    case 'challenge':return quietAct('challenge',{});
    case 'count':return act('count');
    case 'drop':return act('play',{card:selHand,take:[]});
    case 'hint':{hint=findCapture(game.hands[pid]||[],game.table||[]);if(!hint)toast('No capture adds to 15. Lay a card down.');else{selHand=hint.hand;selTable=new Set(hint.take)}return render()}
    case 'next':return act('next');
    case 'rematch':return act('rematch');
    case 'end':return act('close').then(j=>j&&leave());
  }
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='joincode')app.querySelector('[data-act="joincode"]')?.click();if(e.key==='Enter'&&e.target.id==='name'&&view==='lobby')createGame()});

const h=location.hash.slice(1).toUpperCase(),saved=load('escoba.game');
if(/^[A-Z]{4}$/.test(h))openGame(h);else if(saved)openGame(saved,true);else{render();pollLobby()}
</script>
</body>
</html>
